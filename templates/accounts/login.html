{% extends 'base.html' %}

{% block title %}Log In — Sportiva CM{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full glass-panel p-8 rounded-3xl space-y-6 shadow-2xl border border-slate-800">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-2xl mx-auto">
        <i class="fa-solid fa-right-to-bracket"></i>
      </div>
      <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
      <p class="text-slate-400 text-xs">Access your Sportiva CM account</p>
    </div>

    <form method="post" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Username</label>
        <input type="text" name="username" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
        <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-emerald-500 text-sm">
      </div>
      <button type="submit" class="camer-btn w-full py-3.5 rounded-xl text-sm font-bold shadow-lg mt-2">
        Log In
      </button>
    </form>

    <div class="text-center text-xs text-slate-400 pt-4 border-t border-slate-800">
      Don't have an account? <a href="{% url 'register' %}" class="text-emerald-400 hover:underline font-semibold">Register here</a>
    </div>
  </div>
</div>
{% endblock %}
